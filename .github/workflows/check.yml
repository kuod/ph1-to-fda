name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-scripts.js
      - run: node tools/check-data.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
